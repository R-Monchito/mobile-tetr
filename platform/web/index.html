<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tetrio Mobile - Web</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    #game-area {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    #game-canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }

    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    #score-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 1.25rem;
      font-weight: 600;
    }

    #next-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    #next-label {
      font-size: 0.75rem;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #next-pieces {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .next-piece {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      font-size: 1.5rem;
      font-weight: bold;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
    }

    #hold-panel {
      position: absolute;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    #hold-btn {
      width: 80px;
      height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 16px;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #hold-btn:disabled {
      opacity: 0.4;
    }

    #hold-btn .held-piece {
      font-family: monospace;
      font-size: 2rem;
      font-weight: bold;
    }

    #game-over-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.9);
      flex-direction: column;
      gap: 24px;
      padding: 24px;
    }

    #game-over-overlay.visible {
      display: flex;
    }

    #game-over-overlay h1 {
      font-size: 3rem;
      font-weight: 800;
      color: #ff4444;
      letter-spacing: 0.02em;
    }

    #game-over-overlay .final-stats {
      display: flex;
      gap: 32px;
      font-family: monospace;
      font-size: 1.5rem;
    }

    #restart-btn {
      padding: 16px 48px;
      font-size: 1.125rem;
      font-weight: 600;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    #restart-btn:active {
      transform: scale(0.98);
    }

    /* Mobile touch controls */
    @media (pointer: coarse) {
      #touch-controls {
        display: flex;
        justify-content: space-between;
        padding: 16px;
        pointer-events: auto;
      }

      .touch-btn {
        width: 64px;
        height: 64px;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 12px;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
      }

      .touch-btn:active {
        background: rgba(255,255,255,0.3);
      }
    }

    @media (pointer: fine) {
      #touch-controls {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="game-area">
      <canvas id="game-canvas"></canvas>

      <div id="ui-overlay">
        <div id="top-bar">
          <div id="score-panel">
            <div id="score" class="stat">Score: 0</div>
            <div id="lines" class="stat">Lines: 0</div>
          </div>

          <div id="next-panel">
            <div id="next-label">Next</div>
            <div id="next-pieces" id="next"></div>
          </div>
        </div>

        <div id="hold-panel">
          <button id="hold-btn" class="touch-btn" disabled>
            <span class="held-piece" id="held">—</span>
            <span>HOLD</span>
          </button>
        </div>
      </div>

      <div id="game-over-overlay" id="game-over">
        <h1>GAME OVER</h1>
        <div class="final-stats">
          <div>Score: <span id="final-score">0</span></div>
          <div>Lines: <span id="final-lines">0</span></div>
        </div>
        <button id="restart-btn">RESTART</button>
      </div>

      <!-- Mobile touch controls -->
      <div id="touch-controls">
        <button class="touch-btn" data-action="left">←</button>
        <button class="touch-btn" data-action="rotate-ccw">↶</button>
        <button class="touch-btn" data-action="rotate-cw">↷</button>
        <button class="touch-btn" data-action="right">→</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
